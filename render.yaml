services:
  - type: web
    name: fitloop
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: ADMIN_USER
        value: demo
      - key: ADMIN_PASS
        value: gold2026
      - key: MCP_KEY
        generateValue: true
      - key: DATA_DIR
        value: /tmp/fitloop
